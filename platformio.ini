; M5Weather: weather display for M5Stack PaperColor (ESP32-S3, E Ink Spectra 6)
;
; Uses the pioarduino fork of the espressif32 platform for Arduino core 3.x,
; which recent M5Unified/M5GFX releases (with PaperColor support) target.

[env:papercolor]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; PaperColor is an ESP32-S3R8: 16MB flash, 8MB octal (OPI) PSRAM.
; M5GFX refuses to init the e-ink panel without OPI PSRAM enabled.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; Serial over the native USB-C port (no UART bridge chip on this board)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Unified@^0.2.7
    m5stack/M5GFX@^0.2.20
    bblanchon/ArduinoJson@^7.0.0

monitor_speed = 115200
upload_speed = 1500000
